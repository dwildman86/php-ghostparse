# Tags a release when CHANGELOG.md gets a new version: push to main with "## 1.3.0" at the top of the changelog and
# this creates tag v1.3.0 and a GitHub release from that section. Packagist picks the tag up as the new version.
# Run it by hand (Actions → Release → Run workflow) to tag an earlier commit, e.g. version 1.1.0 at an old commit.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to tag, e.g. 1.1.0 (default: the newest in CHANGELOG.md)"
        required: false
      ref:
        description: "Commit to tag (default: the latest on main)"
        required: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Work out the version
        id: v
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          INPUT_REF: ${{ github.event.inputs.ref }}
        run: |
          version="${INPUT_VERSION:-$(grep -m1 -oE '^## +[0-9]+\.[0-9]+\.[0-9]+' CHANGELOG.md | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then echo "No version found"; exit 1; fi
          ref="${INPUT_REF:-$GITHUB_SHA}"
          git rev-parse --verify "$ref^{commit}" >/dev/null
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "v$version already exists"; echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # The changelog section for this version becomes the release notes.
          awk -v v="$version" '$0 ~ "^## +"v"( |$)" {on=1; next} /^## / && on {exit} on' CHANGELOG.md > notes.md || true
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "ref=$(git rev-parse "$ref^{commit}")" >> "$GITHUB_OUTPUT"

      - name: Tag and release
        if: steps.v.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.v.outputs.version }}" --target "${{ steps.v.outputs.ref }}" \
            --title "v${{ steps.v.outputs.version }}" --notes-file notes.md
